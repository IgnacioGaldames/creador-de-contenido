<style type="text/css">
  #inpage_generico {
    font-family: 'Lato', sans-serif;
    padding-bottom: 40px;
    overflow-x: hidden;
    background: #fff;
  }

  #inpage_generico img {
    width: 90%;
    max-width: 1200px;
    margin: 0 auto;
    padding-bottom: 10px;
  }

  #inpage_generico img.img_contenido {
    width: 60%;
    max-width: 1200px;
    margin: 0 auto;
    padding-bottom: 10px;
  }

  #inpage_generico h2 {
    display: block;
    color: #263b91;
    font-size: 18px;
    margin-top: 20px;
    line-height: 22px;
    letter-spacing: 1px;
    font-weight: bold;
    text-align: center;
    text-transform: uppercase;
  }

  #inpage_generico h3 {
    display: block;
    color: #3b3b3b;
    font-size: 25px;
    margin: 20px 0px 40px 0px;
    line-height: 26px;
    letter-spacing: 1px;
    font-weight: bold;
    text-align: center;
    text-transform: uppercase;
  }

  #inpage_generico span {
    display: block;
    color: #393939;
    font-size: 36px;
    margin: 20px 0px 40px 0px;
    line-height: 35px;
    letter-spacing: 1px;
    font-weight: bold;
    text-align: center;
    text-transform: uppercase;
    font-style: italic;
  }

  #inpage_generico p {
    display: block;
    text-decoration: none;
    color: #333;
    font-size: 12px;
    margin: 10px 10px 30px 20px;
    line-height: 16px;
    text-align: justify;
  }

  #inpage_generico .categoria {
    width: 100%;
    padding-top: 40px;
    text-align: center;
    margin-left: 20px;
    margin-right: 20px
  }

  @media (max-width: 600px) {
    #inpage_generico .categoria {
      padding-top: 0px;
      text-align: center;
      padding-right: 30px;

    }

    #inpage_generico img.img_contenido {
      width: 80%;
      max-width: 1200px;
      margin: 0 auto;
      padding-bottom: 20px;
    }

    #inpage_generico img {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 0;
      padding-top: 20px;
    }

    #inpage_generico span {
      font-size: 30px;
    }

    #inpage_generico h2 {
      margin-right: 20px;
    }

    #inpage_generico p {

      margin: 10px 10px 30px 0;

    }

    #inpage_generico h3 {

      line-height: 33px;
    }
  }
</style>
<div id="inpage_generico">
  <section class="categoria">
    <div class="container">
      <div class="row align-items-center justify-content-center">
        <div class="col-12 ">
          <!-- contenido -->
          {bloquesContenido}

        </div>
        <div class="col-12 ">
          <!-- imagenes -->
          <picture>
            <source data-size="mobile" media="(max-width: 767.98px)"
              srcset="images/inpages/2026/{DEPTO}/{SKU HITES}/{imagen}.jpg?$staticlink$">
            <source data-size="desktop" media="(min-width: 768px)"
              srcset="images/inpages/2026/{DEPTO}/{SKU HITES}/{imagen}.jpg?$staticlink$">
            <img loading="lazy" decoding="async"
              src="images/inpages/2026/{DEPTO}/{SKU HITES}/{imagen}.jpg?$staticlink$"
              class="img-fluid w-100 rounded-3"
              alt="{NOMBRE} {MARCA}"
              title="{NOMBRE} {MARCA}"
              data-department="{DEPTO}" data-position="1" data-size="12" data-zone="inpage" class="img-fluid">
          </picture>
          <!-- end imagenes -->
        </div>

      </div>
    </div>
  </section>
</div>
